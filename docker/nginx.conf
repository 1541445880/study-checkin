# 学习打卡系统 - Docker 版 Nginx 配置
# 挂载到 nginx 容器：/etc/nginx/conf.d/default.conf
# 注意：反代地址用「容器服务名」backend（docker-compose 网络内互通），不再是 127.0.0.1

server {
    listen       80;
    server_name  _;

    # 前端 H5 静态资源（挂载到容器内 /usr/share/nginx/html/checkin）
    root   /usr/share/nginx/html/checkin;
    index  index.html;

    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理到 backend 容器（8080）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ★ AI 聊天流式输出(SSE)关键：关闭缓冲，否则打字机卡住/一次性全出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # 上传的图片（头像 / 背景 / 打卡照片）反代到 backend 容器
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 30d;
    }
}
