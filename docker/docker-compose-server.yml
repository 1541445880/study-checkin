# =============================================================
# 学习打卡系统 - Docker Compose 编排（服务器实际部署版）
# 位置：服务器 /opt/study/docker-compose.yml
# 启动：docker compose up -d
# 升级后端：重新打包上传 jar 后 → docker compose up -d --build
# =============================================================

services:

  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: study_checkin
      TZ: Asia/Shanghai
    # 服务端统一 utf8mb4（配合 /opt/sql 里 SQL 文件开头的 SET NAMES utf8mb4）
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      # init 脚本只在数据卷为空（首次启动）时自动执行；已有数据的卷不会重跑
      - /opt/sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    # 注意：3306 不映射到宿主机，数据库只在容器网络内部访问

  # ---------- 后端 ----------
  backend:
    build: .
    image: study-checkin-backend:1.0.0
    container_name: backend
    depends_on:
      - mysql
    environment:
      # 环境变量覆盖 jar 内 application.yml 的 127.0.0.1 → 容器网络的 mysql:3306
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/study_checkin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      # 豆包（火山方舟）API Key，从 .env 注入，不进代码库
      ARK_API_KEY: "${ARK_API_KEY}"
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    volumes:
      - upload-data:/app/uploads
    restart: unless-stopped
    # 注意：8080 也不映射，外面只能走 nginx 反代

  # ---------- Nginx（唯一对外入口） ----------
  nginx:
    image: nginx
    container_name: nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - /root/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
      - /usr/share/nginx/checkin:/usr/share/nginx/checkin:ro
    restart: unless-stopped

# 顶层卷声明：external=true 表示使用已存在的卷（里面有你现在的数据），
# compose 不会新建带前缀的卷，也不会重新 init
volumes:
  mysql-data:
    external: true
  upload-data:
    external: true
