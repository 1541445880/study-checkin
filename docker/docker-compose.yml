# =============================================================
# 学习打卡系统 - Docker 容器编排（mysql + backend + nginx 三容器）
# 用法：在服务器本目录执行  docker compose up -d --build
# =============================================================

services:

  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: checkin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: study_checkin
      TZ: Asia/Shanghai
    # 统一 utf8mb4 字符集
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      # 首次启动自动按文件名顺序执行 01_schema.sql → 02_data.sql 建库导数据
      - ./init:/docker-entrypoint-initdb.d:ro
      # 数据持久化：容器删了数据还在
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # 注意：不映射 3306 到宿主机！数据库只在容器网络内部访问，更安全

  # ---------- 后端 ----------
  backend:
    build: ./backend
    image: study-checkin-backend:1.0.0
    container_name: checkin-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # ★ 用环境变量覆盖 jar 里的 127.0.0.1:3306 → 容器网络内的 mysql:3306
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/study_checkin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      TZ: Asia/Shanghai
    volumes:
      # 上传的图片持久化（对应 jar 里 upload.path=./uploads，即容器内 /app/uploads）
      - upload-data:/app/uploads
    restart: unless-stopped
    # 注意：也不映射 8080，外面只能通过 nginx 反代访问，8080 不对公网暴露

  # ---------- Nginx（唯一对外入口） ----------
  nginx:
    image: nginx:alpine
    container_name: checkin-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html/checkin:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  mysql-data:
  upload-data:
