# 学习打卡系统 Nginx 配置（前端静态 + 反向代理后端 + SSE 流式 + 图片）
# 放置位置：/etc/nginx/conf.d/checkin.conf（或 nginx.conf 的 http 块内）

server {
    listen       80;
    server_name  _;   # 改成你的服务器 IP 或域名

    # 前端 H5 静态资源目录（HBuilderX 发行产物 unpackage/dist/build/h5 上传到这里）
    root   /usr/share/nginx/html/checkin;
    index  index.html;

    # 上传图片大小上限（打卡照片可能多张）
    client_max_body_size 10m;

    # 前端页面（单页应用，路由兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理到 8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ★ AI 聊天流式输出(SSE)关键：必须关闭缓冲，否则打字机效果会卡住/一次性全出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # 上传的图片（头像 / 背景 / 打卡照片）反代到后端静态资源映射
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
    }
}
